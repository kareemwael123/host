<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tian Hosting | Minecraft Servers</title>
    <!-- استدعاء Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء SweetAlert2 للرسائل المنبثقة الجميلة -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #0f172a; /* لون داكن */
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .neon-text {
            text-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- شريط التنقل (Navbar) -->
    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold text-emerald-400 neon-text">Tian Hosting</h1>
            
            <!-- منطقة تسجيل الدخول -->
            <div id="auth-section">
                <button id="login-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded transition">
                    Login with Google
                </button>
                <div id="user-info" class="hidden flex items-center gap-3">
                    <img id="user-pic" src="" alt="User" class="w-10 h-10 rounded-full border-2 border-emerald-500">
                    <span id="user-name" class="font-bold"></span>
                    <button id="logout-btn" class="text-red-400 hover:text-red-300 text-sm underline">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- الهيدر -->
    <header class="text-center py-16 px-4">
        <h2 class="text-5xl font-extrabold mb-4">Premium Minecraft Hosting</h2>
        <p class="text-gray-400 text-xl max-w-2xl mx-auto">Get the best performance for your Minecraft server. Order now and pay easily via Discord.</p>
    </header>

    <!-- خطط الاستضافة -->
    <div class="container mx-auto px-4 pb-20">
        <div id="plans-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- سيتم إضافة الخطط هنا بواسطة الجافاسكربت -->
        </div>
    </div>

    <!-- كود الجافاسكربت و Firebase -->
    <script type="module">
        // استدعاء مكتبات فايربيس
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // بيانات الفايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyC0lwVRTBPA3yxnZ3wuqvyfQJbJP-AVNJo",
            authDomain: "kareem-8ed77.firebaseapp.com",
            databaseURL: "https://kareem-8ed77-default-rtdb.firebaseio.com",
            projectId: "kareem-8ed77",
            storageBucket: "kareem-8ed77.firebasestorage.app",
            messagingSenderId: "557227389584",
            appId: "1:557227389584:web:f8ffa9c5913ef54c919e15",
            measurementId: "G-919VM45PXW"
        };

        // تهيئة الفايربيس
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // الخطط بالأسعار والدولار
        const plans = [
            { name: "Dirt Plan", ram: "2GB RAM", cpu: "50% CPU", storage: "8GB NVMe SSD", price: "$1.00", img: "https://images.unsplash.com/photo-1627409337059-d8916d1d497c?auto=format&fit=crop&w=400&q=80" },
            { name: "Stone Plan", ram: "4GB RAM", cpu: "80% CPU", storage: "12GB NVMe SSD", price: "$2.00", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" },
            { name: "Iron Plan", ram: "6GB RAM", cpu: "100% CPU", storage: "20GB NVMe SSD", price: "$3.50", img: "https://images.unsplash.com/photo-1501166222995-bb049e635817?auto=format&fit=crop&w=400&q=80" },
            { name: "Diamond Plan", ram: "8GB RAM", cpu: "150% CPU", storage: "25GB NVMe SSD", price: "$5.00", img: "https://images.unsplash.com/photo-1614088661858-a400908867a5?auto=format&fit=crop&w=400&q=80" },
            { name: "Blaze Plan", ram: "12GB RAM", cpu: "200% CPU", storage: "35GB NVMe SSD", price: "$10.00", img: "https://images.unsplash.com/photo-1542451542907-6cf80ff362d6?auto=format&fit=crop&w=400&q=80" },
            { name: "Netherite Plan", ram: "16GB RAM", cpu: "280% CPU", storage: "50GB NVMe SSD", price: "$16.00", img: "https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&w=400&q=80" },
            { name: "Titan Plan", ram: "32GB RAM", cpu: "400% CPU", storage: "70GB NVMe SSD", price: "$22.00", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80" },
            { name: "Infinity Plan", ram: "64GB RAM", cpu: "600% CPU", storage: "100GB NVMe SSD", price: "$28.00", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80" }
        ];

        // عرض الخطط في الموقع
        const plansContainer = document.getElementById('plans-container');
        plans.forEach(plan => {
            const card = document.createElement('div');
            card.className = "plan-card bg-gray-800 border border-gray-700 rounded-xl overflow-hidden transition duration-300 flex flex-col";
            card.innerHTML = `
                <img src="${plan.img}" alt="${plan.name}" class="w-full h-40 object-cover opacity-80 hover:opacity-100 transition">
                <div class="p-6 flex-grow flex flex-col">
                    <h3 class="text-2xl font-bold text-emerald-400 mb-2">${plan.name}</h3>
                    <ul class="text-gray-300 space-y-2 mb-6 flex-grow text-sm">
                        <li>🚀 ${plan.ram}</li>
                        <li>⚡ ${plan.cpu}</li>
                        <li>💾 ${plan.storage}</li>
                    </ul>
                    <div class="text-3xl font-bold text-white mb-4">${plan.price}<span class="text-sm text-gray-400 font-normal">/month</span></div>
                    <button onclick="orderPlan('${plan.name}', '${plan.price}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-emerald-500/30">
                        Order Now
                    </button>
                </div>
            `;
            plansContainer.appendChild(card);
        });

        // نظام تسجيل الدخول والخروج
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        const userNameText = document.getElementById('user-name');
        const userPic = document.getElementById('user-pic');

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                Swal.fire('Error', 'فشل تسجيل الدخول', 'error');
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // مراقبة حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                userNameText.innerText = user.displayName;
                userPic.src = user.photoURL;
            } else {
                currentUser = null;
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        });

        // دالة طلب السيرفر
        window.orderPlan = async (planName, price) => {
            // لو مش مسجل دخول، نطلب منه يسجل الأول
            if (!currentUser) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Login Required',
                    text: 'Please login first to order a server.',
                    confirmButtonText: 'Login Now',
                    confirmButtonColor: '#10b981'
                }).then((result) => {
                    if (result.isConfirmed) {
                        signInWithPopup(auth, provider);
                    }
                });
                return;
            }

            // لو مسجل دخول، نأكد عليه الطلب ونسجل في الداتا بيز
            const { value: discordUser } = await Swal.fire({
                title: 'Order ' + planName,
                text: 'Enter your Discord Username so we can contact you:',
                input: 'text',
                inputPlaceholder: 'e.g. user#1234',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                confirmButtonText: 'Confirm Order',
                inputValidator: (value) => {
                    if (!value) {
                        return 'You need to write your Discord username!'
                    }
                }
            });

            if (discordUser) {
                Swal.fire({
                    title: 'Processing...',
                    text: 'Saving your order...',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading()
                    }
                });

                try {
                    // حفظ الطلب في Firestore
                    const docRef = await addDoc(collection(db, "server_orders"), {
                        userEmail: currentUser.email,
                        userName: currentUser.displayName,
                        discordUsername: discordUser,
                        plan: planName,
                        price: price,
                        status: "Awaiting Payment via Discord",
                        createdAt: serverTimestamp()
                    });

                    // إظهار رسالة النجاح وتعليمات الدفع
                    Swal.fire({
                        icon: 'success',
                        title: 'Order Placed!',
                        html: `
                            <p class="mb-4">Your order ID is: <br><strong class="text-emerald-500 bg-gray-800 p-1 rounded select-all">${docRef.id}</strong></p>
                            <div class="bg-gray-100 text-gray-900 p-4 rounded-lg text-left">
                                <h4 class="font-bold mb-2 border-b pb-2">Payment Instructions:</h4>
                                <p class="text-sm">1. Copy your Order ID.</p>
                                <p class="text-sm">2. Open Discord and send a Direct Message to: <strong class="text-indigo-600 font-bold text-lg">__zito__</strong></p>
                                <p class="text-sm">3. Send him your Order ID to complete the payment and receive your server IP.</p>
                            </div>
                        `,
                        confirmButtonText: 'Understood',
                        confirmButtonColor: '#10b981'
                    });

                } catch (error) {
                    console.error("Error adding document: ", error);
                    Swal.fire('Error', 'حدث خطأ أثناء تسجيل الطلب، يرجى المحاولة لاحقاً', 'error');
                }
            }
        };
    </script>
</body>
</html>
